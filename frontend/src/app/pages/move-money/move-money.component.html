<section class="page">
  <header>
    <p class="eyebrow">Move money</p>
    <h1>Deposit, withdraw, or transfer</h1>
    <p class="muted">One action at a time — choose a flow and confirm the amount.</p>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" [class.active]="tab() === 'deposit'" (click)="setTab('deposit')">Deposit</button>
    <button type="button" [class.active]="tab() === 'withdraw'" (click)="setTab('withdraw')">Withdraw</button>
    <button type="button" [class.active]="tab() === 'transfer'" (click)="setTab('transfer')">Transfer</button>
  </div>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="alert alert-success">{{ message() }}</div>
  }

  @if (tab() !== 'transfer') {
    <form class="panel" [formGroup]="amountForm" (ngSubmit)="submitAmount(tab() === 'deposit' ? 'deposit' : 'withdraw')">
      <div class="field">
        <label for="accountNumber">Account</label>
        <select id="accountNumber" formControlName="accountNumber">
          @for (account of accounts(); track account.id) {
            <option [value]="account.accountNumber">
              {{ account.accountNumber }} · {{ account.accountType }}
            </option>
          }
        </select>
      </div>
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0.01" step="0.01" formControlName="amount" />
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">
        {{ busy() ? 'Working…' : tab() === 'deposit' ? 'Deposit' : 'Withdraw' }}
      </button>
    </form>
  } @else {
    <form class="panel" [formGroup]="transferForm" (ngSubmit)="submitTransfer()">
      <div class="field">
        <label for="fromAccountNumber">From</label>
        <select id="fromAccountNumber" formControlName="fromAccountNumber">
          @for (account of accounts(); track account.id) {
            <option [value]="account.accountNumber">
              {{ account.accountNumber }} · {{ account.accountType }}
            </option>
          }
        </select>
      </div>
      <div class="field">
        <label for="toAccountNumber">To account number</label>
        <input id="toAccountNumber" formControlName="toAccountNumber" placeholder="ACC…" />
      </div>
      <div class="field">
        <label for="transferAmount">Amount</label>
        <input id="transferAmount" type="number" min="0.01" step="0.01" formControlName="amount" />
      </div>
      <div class="field">
        <label for="remarks">Remarks</label>
        <input id="remarks" formControlName="remarks" />
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">
        {{ busy() ? 'Transferring…' : 'Transfer' }}
      </button>
    </form>
  }
</section>
