spring.application.name=banking
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db
spring.datasource.username=root
spring.datasource.password=Smartnj18@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=ThisIsMySuperSecretKeyForBankingApplication12345678901234567890
jwt.expiration=86400000

# --- Actuator / resilience visibility ---
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,ratelimiters,retries,bulkheads
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# --- Circuit Breaker: account operations ---
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.accountService.ignoreExceptions=com.banking.demo.exceptions.InvalidAmountException,com.banking.demo.exceptions.InsufficientBalanceException,com.banking.demo.exceptions.AccountNotFoundException,com.banking.demo.exceptions.CustomerNotFoundException,com.banking.demo.exceptions.AccountInactiveException,com.banking.demo.exceptions.SameAccountTransferException,java.lang.IllegalArgumentException,io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

# --- Circuit Breaker: transactions ---
resilience4j.circuitbreaker.instances.transactionService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transactionService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.transactionService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.transactionService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transactionService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.transactionService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.transactionService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.transactionService.ignoreExceptions=com.banking.demo.exceptions.InvalidAmountException,com.banking.demo.exceptions.InsufficientBalanceException,com.banking.demo.exceptions.AccountNotFoundException,com.banking.demo.exceptions.AccountInactiveException,com.banking.demo.exceptions.SameAccountTransferException,java.lang.IllegalArgumentException,io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

# --- Circuit Breaker: customers ---
resilience4j.circuitbreaker.instances.customerService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.customerService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customerService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.customerService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customerService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.customerService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.customerService.ignoreExceptions=com.banking.demo.exceptions.CustomerNotFoundException,io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

# --- Retry: reads only (never retry money movement to avoid double-posting) ---
resilience4j.retry.instances.readRetry.maxAttempts=3
resilience4j.retry.instances.readRetry.waitDuration=400ms
resilience4j.retry.instances.readRetry.enableExponentialBackoff=true
resilience4j.retry.instances.readRetry.exponentialBackoffMultiplier=2
resilience4j.retry.instances.readRetry.retryExceptions=org.springframework.dao.DataAccessResourceFailureException,org.springframework.dao.TransientDataAccessException,org.springframework.transaction.CannotCreateTransactionException,java.sql.SQLTransientException,java.sql.SQLTransientConnectionException
resilience4j.retry.instances.readRetry.ignoreExceptions=com.banking.demo.exceptions.CustomerNotFoundException,com.banking.demo.exceptions.AccountNotFoundException,com.banking.demo.exceptions.InvalidAmountException,com.banking.demo.exceptions.InsufficientBalanceException

# --- Rate limiter: deposit / withdraw / transfer ---
resilience4j.ratelimiter.instances.moneyMovement.limitForPeriod=30
resilience4j.ratelimiter.instances.moneyMovement.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.moneyMovement.timeoutDuration=0s
resilience4j.ratelimiter.instances.moneyMovement.registerHealthIndicator=true

resilience4j.ratelimiter.instances.accountOps.limitForPeriod=20
resilience4j.ratelimiter.instances.accountOps.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.accountOps.timeoutDuration=0s

# --- Bulkhead: isolate concurrent transfers ---
resilience4j.bulkhead.instances.transferBulkhead.maxConcurrentCalls=15
resilience4j.bulkhead.instances.transferBulkhead.maxWaitDuration=0s
